# Runs every migration against PostgreSQL, which the test suite never does.
#
# pytest builds its schema with db.create_all() on SQLite and runs no
# migrations. SQLite also accepts SQL that PostgreSQL rejects, such as 0 for a
# boolean, so a migration can pass the suite and still fail on deploy.
name: Migrations

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  postgres-upgrade:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Match the Heroku Postgres major version in use. Bump this when the
        # addon is upgraded, or CI stops testing what production runs.
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: rms_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: development
      SECRET_KEY: ci-migration-secret-key
      DEV_LOGIN_ENABLED: "false"
      FLASK_SKIP_DOTENV: "1"
      DATABASE_URL: postgresql://ci:ci@localhost:5432/rms_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # These four steps build a new database in the order it needs.
      # tr7742b1c8e5 refuses to run unless the TECHOPS_NET and TECHOPS_GEN
      # approval groups exist, and only `flask seed bootstrap` creates them.
      # The pinned revision is the one just before tr7742b1c8e5. If a later
      # migration needs seeded rows, pin to the revision before that one.
      #
      # Both seeds use the models in the checked-out code, so a seed run at the
      # pin fails on any table that gains a column after it. Bootstrap reads
      # none of those tables; the demo seed reads event_cycles, so it runs
      # after head.
      - name: Upgrade to the last migration that needs no seeded data
        run: flask db upgrade sp5539947d06

      - name: Seed bootstrap reference data
        run: flask seed bootstrap

      - name: Upgrade to head
        run: flask db upgrade

      - name: Seed demo data against the full schema
        run: flask seed demo

      - name: Show the resulting head
        run: flask db current

      # An upgrade never runs downgrade(), so this step runs the newest one.
      - name: Downgrade one revision and upgrade again
        # "-- -1" not "-1": click parses a leading dash as an option and
        # fails with "No such option: -1" before alembic ever sees it.
        run: |
          flask db downgrade -- -1
          flask db upgrade

      # Fails if the chain built no boolean columns, which means it built no
      # schema. A migration with a type error fails the steps above instead.
      - name: Smoke check that the schema actually built
        run: |
          python - <<'PY'
          import os, sys
          import sqlalchemy as sa

          engine = sa.create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as conn:
              rows = conn.execute(sa.text("""
                  SELECT table_name, column_name
                  FROM information_schema.columns
                  WHERE table_schema = 'public' AND data_type = 'boolean'
                  ORDER BY table_name, column_name
              """)).fetchall()
          print(f"{len(rows)} boolean columns survived the migration chain")
          if not rows:
              sys.exit("No boolean columns found; the schema did not build")
          PY
