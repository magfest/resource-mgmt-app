{# Behavior for _line_account_fields.html. Included inside each template's
   scripts block, because a Jinja include cannot contribute to a parent block. #}
<script nonce="{{ csp_nonce }}">
  const spendTypesByAccount = {{ spend_types_by_account | tojson | safe }};
  const accountPricing = {{ account_pricing | tojson | safe }};
  const currentSpendTypeId = '{{ current_spend_type_id if current_spend_type_id is defined else "" }}';

  const accountSelect = document.getElementById('expense_account_id');
  const spendTypeSelect = document.getElementById('spend_type_id');
  const spendTypeContainer = document.getElementById('spend_type_container');
  const spendTypeHint = document.getElementById('spend_type_hint');
  const groupSelect = document.getElementById('approval_group_id');

  const quantityBlock = document.getElementById('quantity_block');
  const quantityInput = document.getElementById('quantity');
  const hotelBlock = document.getElementById('hotel_block');
  const roomsInput = document.getElementById('rooms');
  const nightsInput = document.getElementById('nights');
  const priceInput = document.getElementById('unit_price');
  const priceHint = document.getElementById('price_hint');
  const overrideWrap = document.getElementById('price_override_wrap');
  const overrideBox = document.getElementById('price_override');

  // The line's own server-rendered price (empty string on add-line, since
  // there is no line yet). autoWritten tracks the last value this script
  // itself wrote into priceInput. That lets a later account switch tell the
  // script's own default apart from what the admin typed.
  const originalPrice = priceInput.value;
  let autoWritten = null;

  // Present on add-line, absent on change-account. Both partials share this
  // script, so every use is guarded.
  const frequencySelect = document.getElementById('frequency_id');
  const warehouseBox = document.querySelector('input[name="warehouse_flag"]');

  function refreshSpendTypes(preselectId) {
    const info = spendTypesByAccount[accountSelect.value];
    spendTypeSelect.innerHTML = '<option value="">(Select spend type)</option>';
    if (!info) {
      spendTypeContainer.style.display = '';
      spendTypeHint.textContent = '';
      return;
    }
    if (info.mode === 'SINGLE_LOCKED') {
      spendTypeContainer.style.display = 'none';
      spendTypeSelect.removeAttribute('required');
      spendTypeHint.textContent = 'Spend type is locked by this account.';
      return;
    }
    spendTypeContainer.style.display = '';
    spendTypeSelect.setAttribute('required', 'required');
    for (const t of info.types) {
      const opt = document.createElement('option');
      opt.value = t.id;
      opt.textContent = t.name;
      if (String(t.id) === String(preselectId)) opt.selected = true;
      spendTypeSelect.appendChild(opt);
    }
  }

  function money(cents) {
    return '$' + (cents / 100).toFixed(2);
  }

  // readOnly alone gets no browser styling, so a locked price field looks
  // editable. Pairing the class here means the two states can never drift
  // apart the way they did before this fix.
  function setPriceLocked(locked) {
    priceInput.readOnly = locked;
    priceInput.classList.toggle('price-locked', locked);
  }

  function refreshPricing() {
    const info = accountPricing[accountSelect.value];
    const isHotel = info && info.kind === 'HOTEL';
    const hasDefault = info && info.kind !== 'STANDARD';

    hotelBlock.style.display = isHotel ? '' : 'none';
    quantityBlock.style.display = isHotel ? 'none' : '';
    if (isHotel) {
      roomsInput.setAttribute('required', 'required');
      nightsInput.setAttribute('required', 'required');
      quantityInput.removeAttribute('required');
    } else {
      roomsInput.removeAttribute('required');
      nightsInput.removeAttribute('required');
      quantityInput.setAttribute('required', 'required');
    }

    overrideWrap.style.display = hasDefault ? '' : 'none';
    if (hasDefault) {
      if (!overrideBox.checked) {
        priceInput.value = (info.default_unit_price_cents / 100).toFixed(2);
        autoWritten = priceInput.value;
        setPriceLocked(true);
        priceHint.textContent = 'Account default ' + money(info.default_unit_price_cents)
            + '. Tick Override to edit.';
      } else {
        setPriceLocked(false);
        priceHint.textContent = 'Account default ' + money(info.default_unit_price_cents) + '.';
      }
    } else {
      priceHint.textContent = '';
      setPriceLocked(false);
      overrideBox.checked = false;
      // Restore the line's own price only if the field still holds exactly
      // what this script wrote for the previously selected account. An
      // unconditional restore here would discard a price the admin typed
      // by hand before switching to a STANDARD account.
      if (autoWritten !== null && priceInput.value === autoWritten) {
        priceInput.value = originalPrice;
        autoWritten = null;
      }
    }
  }

  function defaultGroupFromAccount() {
    const opt = accountSelect.options[accountSelect.selectedIndex];
    const gid = opt ? opt.getAttribute('data-approval-group-id') : '';
    if (gid && groupSelect) groupSelect.value = gid;
  }

  // Called only when the account changes, never on an override toggle.
  // Re-running it on every refresh would discard the admin's own edits.
  function applyAccountDefaults() {
    const info = accountPricing[accountSelect.value];
    if (!info) return;
    if (frequencySelect && info.default_frequency_id) {
      frequencySelect.value = String(info.default_frequency_id);
    }
    if (warehouseBox && info.warehouse_default !== null) {
      warehouseBox.checked = Boolean(info.warehouse_default);
    }
  }

  accountSelect.addEventListener('change', function () {
    refreshSpendTypes('');
    defaultGroupFromAccount();
    overrideBox.checked = false;
    refreshPricing();
    applyAccountDefaults();
  });

  overrideBox.addEventListener('change', function () {
    // From the moment the admin ticks this box, the value in the field is
    // theirs, not the script's; stop treating it as restorable.
    if (overrideBox.checked) {
      autoWritten = null;
    }
    refreshPricing();
  });

  // A zero override on an account with a non-zero default is usually a typo.
  // A comped room is legitimate, so warn rather than block.
  accountSelect.form.addEventListener('submit', function (e) {
    const info = accountPricing[accountSelect.value];
    if (!info || info.kind === 'STANDARD') return;
    if (!overrideBox.checked) return;
    if (info.default_unit_price_cents === 0) return;
    if (parseFloat(priceInput.value || '0') !== 0) return;
    if (!window.confirm('Set this line to $0.00 when the account default is '
        + money(info.default_unit_price_cents) + '?')) {
      e.preventDefault();
    }
  });

  refreshSpendTypes(currentSpendTypeId);
  refreshPricing();
</script>
