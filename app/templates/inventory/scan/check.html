{% extends "inventory/scan/layout.html" %}
{% block content %}{% if blocked %}<p class="chk-blocked">{{ blocked }}</p>{% endif %}{% endblock %}
{% block scripts %}{% if not blocked %}
<script nonce="{{ csp_nonce }}" src="{{ url_for('static', filename='inventory/station_check.js') }}"
        data-station="{{ station }}"
        data-station-name="{{ station_name }}"
        data-open-url="{{ url_for('inventory.scan_check_open') }}"
        data-serial-url="{{ url_for('inventory.scan_check_serial') }}"
        data-finish-url="{{ url_for('inventory.scan_check_finish') }}"
        data-set-aside-url="{{ url_for('inventory.scan_check_set_aside') }}"
        data-bind-url="{{ url_for('inventory.scan_check_bind_label') }}"
        data-create-url="{{ url_for('inventory.scan_check_create_unit') }}"
        data-station-url="{{ url_for('inventory.scan_station_switch') }}"
        data-home-url="{{ url_for('inventory.scan_home') }}"></script>
{% endif %}{% endblock %}
