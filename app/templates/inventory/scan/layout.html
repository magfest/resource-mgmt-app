<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ station_name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='inventory/scan.css') }}">
</head>
<body class="station-{{ station }}" id="scan-body"
      data-station="{{ station }}"
      data-end-url="{{ url_for('inventory.scan_shift_end') }}"
      data-home-url="{{ url_for('inventory.scan_home') }}"
      data-who-url="{{ url_for('inventory.scan_who') }}">
  <header class="band">
    <span class="band-station">{{ station_name }}</span>
    {% if who %}<span class="band-who" id="band-who">{{ who }}</span>{% endif %}
    {% if is_device %}<button type="button" class="band-done" id="done-btn">Done for now</button>{% endif %}
  </header>
  <div id="paused" class="paused" role="status" hidden>Scanner paused: tap here</div>
  <p id="msg" class="msg" role="alert"></p>
  <section id="not-saved" class="not-saved" role="alert" hidden>
    <h2>NOT SAVED</h2>
    <p>Could not reach the server. This was not saved. Try again before scanning more.</p>
    <button type="button" id="not-saved-again" class="choice">Try again</button>
    <button type="button" id="not-saved-cancel" class="choice">Cancel</button>
  </section>
  <main id="panel" class="panel">{% block content %}{% endblock %}</main>
  <input id="scan-input" class="capture" type="text" inputmode="none" autocomplete="off"
         autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Scan a code">
  <script nonce="{{ csp_nonce }}" src="{{ url_for('static', filename='inventory/scan.js') }}"></script>
  {% block scripts %}{% endblock %}
</body></html>
