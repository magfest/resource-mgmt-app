{% extends "inventory/scan/layout.html" %}
{% block content %}<p class="hint">Scan a label, tag, serial or barcode.</p>{% endblock %}
{% block scripts %}
<script nonce="{{ csp_nonce }}" src="{{ url_for('static', filename='inventory/station_label.js') }}"
        data-options-url="{{ url_for('inventory.scan_label_options') }}"
        data-print-url="{{ url_for('inventory.scan_label_print') }}"
        data-new-tag-url="{{ url_for('inventory.scan_label_new_tag') }}"
        data-items-url="{{ url_for('inventory.scan_receive_items') }}"></script>
<script nonce="{{ csp_nonce }}" src="{{ url_for('static', filename='inventory/station_lookup.js') }}"
        data-resolve-url="{{ url_for('inventory.scan_resolve') }}"></script>
{% endblock %}
