<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<link rel="manifest" href="{{ url_for('static', filename='inventory/scan.webmanifest') }}">
<style>
  body { font-family: system-ui, sans-serif; padding: 16px; }
</style></head>
<body>
  <h1>Sign in</h1>
  {% if not is_device %}
    <p>You are signed in as {{ who }}. Shared scanners ask people to sign in; you do not need to.</p>
    <p><a href="{{ url_for('inventory.scan_home') }}">Back to the scanner</a></p>
  {% else %}
    <script nonce="{{ csp_nonce }}" src="{{ url_for('static', filename='inventory/fullscreen.js') }}"></script>
  {% endif %}
</body></html>
