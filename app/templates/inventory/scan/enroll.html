<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enroll scanner</title></head>
<body style="font-family: system-ui, sans-serif; padding: 16px;">
  <h1>Make this a shared scanner</h1>
  <p>Ask an inventory admin for an enrollment code.</p>
  {% if error %}<p role="alert" style="color: #b00020;">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('inventory.scan_enroll_post') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Enrollment code<br>
      <input type="text" name="code" required maxlength="16" autocomplete="off"
             autocapitalize="characters" autocorrect="off" spellcheck="false"
             style="font-size: 1.6rem; letter-spacing: 0.1em; width: 100%; box-sizing: border-box;">
    </label>
    <button type="submit" style="display: block; width: 100%; padding: 16px; margin-top: 12px; font-size: 1.1rem;">Enroll</button>
  </form>
</body></html>
